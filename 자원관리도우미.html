<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자원관리 도우미</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--line:#dde2ea;--line2:#eef1f5;--text:#1f2937;--muted:#6b7280;
  --primary:#1d4ed8;--primary-weak:#e8efff;--navy:#16233b;
  --red:#c62828;--red-bg:#fdecec;--orange:#b45309;--orange-bg:#fff4e0;--green:#2e7d32;--green-bg:#e8f5e9;--gray-bg:#f1f3f5;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toprow{display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;white-space:nowrap}
.brand small{font-size:12px;font-weight:400;opacity:.7;margin-left:6px}
.tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools label{font-size:13px;opacity:.9}
.tools select{padding:4px 6px;border-radius:4px;border:0}
.fileinfo{font-size:12px;opacity:.85;max-width:420px}
.dirty{font-size:12px;padding:3px 8px;border-radius:10px;background:#f59e0b;color:#111;font-weight:700}
.samplebadge{font-size:11px;padding:2px 7px;border-radius:9px;background:#7c3aed;color:#fff;font-weight:700}
.saved{font-size:12px;padding:3px 8px;border-radius:10px;background:#334155;color:#cbd5e1}
nav.tabs{display:flex;gap:2px;padding:0 16px}
nav.tabs button{background:transparent;color:#cbd5e1;border:0;padding:9px 18px;cursor:pointer;border-bottom:3px solid transparent;font-size:14px}
nav.tabs button.on{color:#fff;border-bottom-color:#60a5fa;font-weight:700}
nav.tabs button:hover{color:#fff}
.tbtn{background:#2b3d5f;color:#fff;border:1px solid #3f5580;padding:5px 12px;border-radius:4px;cursor:pointer}
.tbtn:hover{background:#344a73}
.tbtn.primary{background:#2563eb;border-color:#2563eb}
main{padding:18px 20px 60px;max-width:1500px;margin:0 auto}
h2{font-size:18px;margin:4px 0 14px}
h3{font-size:15px;margin:0 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card .k{font-size:12px;color:var(--muted)}
.card .v{font-size:24px;font-weight:700;margin-top:4px}
.card.red .v{color:var(--red)} .card.orange .v{color:var(--orange)} .card.green .v{color:var(--green)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--primary-weak);border:1px solid #bcd0ff;border-radius:8px;padding:12px 16px;margin-bottom:16px}
.banner.ok{background:var(--green-bg);border-color:#b7dfb9}
.alert{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:6px;margin-bottom:6px;cursor:pointer;border:1px solid transparent;flex-wrap:wrap}
.alert:hover{filter:brightness(.97);border-color:rgba(0,0,0,.08)}
.alert.red{background:var(--red-bg);color:#7f1d1d}
.alert.orange{background:var(--orange-bg);color:#78350f}
.alert .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;color:#fff;white-space:nowrap}
.alert.red .tag{background:var(--red)} .alert.orange .tag{background:var(--orange)}
.empty{color:var(--muted);padding:8px 2px;font-size:13px}
.subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:18px;cursor:pointer}
.subtabs button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters label{font-size:13px;color:var(--muted)}
.filters input,.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:#fff}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--gray-bg)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:#1e40af}
.btn.danger{color:var(--red);border-color:#f3b4b4}
.btn.sm{padding:2px 8px;font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.t th{background:#f5f7fa;border-bottom:2px solid var(--line);padding:7px 8px;text-align:left;font-weight:700;white-space:nowrap;position:sticky;top:0}
table.t td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:middle}
table.t tr:hover td{background:#fafbfd}
table.t th.sortable{cursor:pointer;user-select:none}
.col-resizer{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:3;border-right:2px solid transparent}
table.t th:hover .col-resizer{border-right-color:#c7d2e3}
.col-resizer:hover,body.col-resizing .col-resizer:active{background:rgba(29,78,216,.28)}
body.col-resizing{cursor:col-resize;user-select:none}
body.col-resizing *{cursor:col-resize!important}
table.t.fixedw{table-layout:fixed}
table.t.fixedw th,table.t.fixedw td{overflow:hidden;overflow-wrap:anywhere}
table.t th.sortable:hover{background:#e8eef8}
.sarrow{margin-left:4px;font-size:10px;color:#b0b7c3}
.sarrow.on{color:var(--primary);font-size:11px}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
table.t tr.sub td{background:#f3f5f9;font-weight:700}
table.t tr.total td{background:#e6edfb;font-weight:700}
table.t tr.rowred td{background:#fff5f5}
table.t tr.rowshort td{background:#fff8ec}
table.t input[type=number]{width:80px;padding:3px 6px;border:1px solid #c9d2e0;border-radius:4px;text-align:right}
.tablewrap{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green)}
.b-blue{background:var(--primary-weak);color:var(--primary)}
.b-gray{background:#e5e7eb;color:#4b5563}
.b-red{background:var(--red-bg);color:var(--red)}
.b-orange{background:var(--orange-bg);color:var(--orange)}
.b-yellow{background:#fef9c3;color:#854d0e}
.card.yellow .v{color:#a16207}
.alert.yellow{background:#fefce8;color:#713f12}
.alert.yellow .tag{background:#ca8a04}
.txt-red{color:var(--red);font-weight:700}
.txt-orange{color:var(--orange);font-weight:700}
.muted{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:6px;padding:7px 12px;background:#fff;font-size:13px}
.chip b{font-size:17px;color:var(--primary)}
.chip.zero b{color:var(--muted)}
.chip .tp{color:var(--muted);font-size:12px;margin-right:4px}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:13px}
.flash td,.flash.alert,div.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,40%{background:#fde68a}100%{}}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;padding:12px 4px 0;font-size:15px}
.sumbar b{font-size:18px}
.over{color:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding-top:7vh}
.modal-bg.hidden{display:none}
.modal{background:#fff;border-radius:10px;width:520px;max-width:94vw;max-height:86vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide{width:960px}
.dirty,.saved{cursor:pointer}
.dirty:hover{background:#fbbf24}
.chg-add{background:var(--green-bg);color:var(--green)} .chg-mod{background:var(--primary-weak);color:var(--primary)} .chg-del{background:var(--red-bg);color:var(--red)}
.chgdet{font-size:12px;color:#374151;line-height:1.6}
.chgdet s{color:#9ca3af}
.modal h3{font-size:17px;margin-bottom:14px}
.frow{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:8px;margin-bottom:10px}
.frow label{font-size:13px;color:#374151}
.frow input,.frow select,.frow textarea{padding:6px 8px;border:1px solid #c9d2e0;border-radius:4px;width:100%}
.req{color:var(--red)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.mfoot .left{margin-right:auto}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:4px;white-space:pre-line}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 10px 128px}
.warnbox{background:var(--orange-bg);color:#78350f;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60}
#toast.show{opacity:.95}
.kv{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#374151;margin-bottom:10px}
.kv b{color:var(--text)}
@media print{header.top,.filters,.subtabs,.btn{display:none!important}.tablewrap{max-height:none;overflow:visible}}
</style>
</head>
<body>
<header class="top">
  <div class="toprow">
    <div class="brand">자원관리 도우미<small>정보통신지원센터</small></div>
    <div class="tools">
      <label>작업자
        <select id="worker" onchange="setWorker(this.value)">
          <option value="정">정 담당자</option>
          <option value="부">부 담당자</option>
        </select>
      </label>
      <span class="fileinfo" id="fileinfo"></span>
      <span id="dirtyBadge"></span>
      <button class="tbtn primary" onclick="saveFile()" title="현재 데이터를 JSON 파일로 저장">💾 저장</button>
      <button class="tbtn" onclick="loadClick()" title="데이터 파일(JSON) 불러오기">📂 불러오기</button>
      <span id="colwReset"></span>
      <button class="tbtn" onclick="startEmpty()" title="샘플 없이 실제 데이터를 처음부터 입력">빈 데이터로 시작</button>
      <button class="tbtn" onclick="resetSample()">샘플 데이터 초기화</button>
      <input type="file" id="fileInput" accept=".json,application/json" style="display:none" onchange="loadFile(this)">
    </div>
  </div>
  <nav class="tabs" id="nav"></nav>
</header>
<main id="main"></main>

<div id="modalBg" class="modal-bg hidden">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="err" id="mErr"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>
<datalist id="dlDept"></datalist>
<datalist id="dlPos"></datalist>
<div id="toast"></div>
<input type="file" id="xlsxInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none" onchange="importEquipFile(this)">

<script>
'use strict';
/* =====================================================================
   상수
   ===================================================================== */
const APP_VERSION = 1;
const TYPES = ['노트북', 'PC', '모니터', '프린터'];
const USAGES = ['대여용', '설치', '재활용']; // 재활용은 설치 장비와 같은 방식으로 관리·표시
const EQ_STATUS = ['사용 중', '대여 가능', '대여 중', '불용처리'];
const CS_KINDS = ['잉크', '토너', '헤드', '유지보수키트'];
const LIFE_ST = ['정상', '사전 검토 대상', '구매 소요 확정 대상', '불용 대상'];
const WLABEL = { 정: '정 담당자', 부: '부 담당자' };
const DEPTS = ['행정과', '기획예산과', '민원과', '총무과', '재무과', '감사실', '정보통신과', '시설관리과', '복지정책과', '교육지원과', '안전관리과', '홍보담당관'];
const SAMPLE_PARENTS = { // 샘플용 가상 상위부서
  행정과: '행정지원국', 총무과: '행정지원국', 민원과: '행정지원국', 정보통신과: '행정지원국',
  기획예산과: '기획조정실', 재무과: '기획조정실', 감사실: '기획조정실', 홍보담당관: '기획조정실',
  복지정책과: '복지교육국', 교육지원과: '복지교육국', 시설관리과: '안전건설국', 안전관리과: '안전건설국',
};
const POSITIONS =['주무관', '팀장', '과장', '계장', '실장'];
const RENTAL_LOC = '정보통신지원센터(대여 보관)';
const PAGE = 100;

/* =====================================================================
   유틸
   ===================================================================== */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const TODAY = () => ymd(new Date());
function addDays(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
function addMonths(s, n) {
  const d = pd(s), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, dim)); return ymd(d);
}
const addYears = (s, n) => addMonths(s, n * 12);
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 86400000); // b - a
const qOf = s => Math.floor(pd(s).getMonth() / 3) + 1;
const qStart = (y, q) => `${y}-${pad((q - 1) * 3 + 1)}-01`;
const qEnd = (y, q) => ymd(new Date(y, q * 3, 0));
const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
const fmtN = n => (Math.round(Number(n) || 0)).toLocaleString('ko-KR');
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('ko-KR');
function fmtDT(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function h(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const ja = s => h(JSON.stringify(String(s))); // onclick 인자용
let _uidc = 0;
const uid = p => p + Date.now().toString(36) + (++_uidc).toString(36) + Math.floor(Math.random() * 1296).toString(36);
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function stamp(d = new Date()) { return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }
function monthsElapsed(ref) { // 1월 1일부터 ref까지 경과 개월(소수)
  const d = pd(ref); const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  return d.getMonth() + d.getDate() / dim;
}

/* =====================================================================
   상태
   ===================================================================== */
let DB = null;          // 전체 데이터
let dirty = false;      // 파일로 저장하지 않은 변경 여부
let loadedName = null;  // 불러온/저장한 파일명
let worker = '정';
let MM = {};            // 모델ID → 모델
let LOAN_BY_ASSET = {}; // 자산번호 → 진행 중 대여
const S = {
  screen: 'home', eqTab: 'rental',
  rf: { type: '', status: '' },
  af: { q: '', type: '', usage: '', status: '', life: '' }, aPage: 0,
  tsort: {}, // 표 정렬 상태: 표 키 → { col, dir }
  wf: { year: '', kind: '' }, wPage: 0,
  hf: Object.assign({ asset: '', dept: '', status: '' }, histPeriod('year1')),
  csTab: 'stock', lf: { kind: '', cid: '', year: '' }, lPage: 0,
  cmpYear: null, pq: null,
  rp: null, highlight: null,
};

function buildIndex() {
  MM = {}; DB.models.forEach(m => MM[m.id] = m);
  LOAN_BY_ASSET = {}; DB.loans.forEach(l => { if (!l.returnDate) LOAN_BY_ASSET[l.assetNo] = l; });
}
function expiry(m) { return addYears(m.introDate, Number(m.life) || 0); }
function lifeStatus(m, base) {
  const ex = expiry(m);
  if (base > ex) return '불용 대상';
  if (ex <= addYears(base, 1)) return '구매 소요 확정 대상';
  if (ex <= addYears(base, 2)) return '사전 검토 대상'; // 만료 1~2년 전: 예산·교체 계획 미리 검토
  return '정상';
}
function lifeBadge(st) {
  return st === '불용 대상' ? `<span class="badge b-red">불용 대상</span>`
    : st === '구매 소요 확정 대상' ? `<span class="badge b-orange">구매 소요 확정 대상</span>`
      : st === '사전 검토 대상' ? `<span class="badge b-yellow">사전 검토 대상</span>`
        : `<span class="badge b-green">정상</span>`;
}
const lifeX = st => st === '불용 대상' ? X.red : st === '구매 소요 확정 대상' ? X.orange : st === '사전 검토 대상' ? X.yellow : X.center;
const isRental = m => m && m.usage === '대여용'; // 설치·재활용은 같은 방식으로 다룸
function eqBadge(st) {
  const c = { '사용 중': 'b-blue', '대여 가능': 'b-green', '대여 중': 'b-orange', '불용처리': 'b-gray' }[st] || 'b-gray';
  return `<span class="badge ${c}">${h(st)}</span>`;
}
function locOf(e) { const l = LOAN_BY_ASSET[e.assetNo]; return l ? `${l.dept} (대여 중)` : e.location; }
function posOf(e) { const l = LOAN_BY_ASSET[e.assetNo]; return l ? l.position : (e.position || ''); }
function sortEquip(a, b) {
  const ma = MM[a.modelId], mb = MM[b.modelId];
  return TYPES.indexOf(ma.type) - TYPES.indexOf(mb.type) || cmp(ma.introDate, mb.introDate) || cmp(ma.name, mb.name) || cmp(a.assetNo, b.assetNo);
}
function modelLabel(m) { return `${m.type} · ${m.name} (${m.introDate.slice(0, 4)} 도입)`; }

/* ---------- 저장/복원 ---------- */
function persist() {
  try { localStorage.setItem('rmh.work', JSON.stringify({ data: DB, dirty, loadedName })); } catch (e) { }
}
function changed(msg) { dirty = true; persist(); render(); if (msg) toast(msg); }
function setWorker(v) { worker = v; try { localStorage.setItem('rmh.worker', v); } catch (e) { } }

function normalize(d) {
  d.models = d.models || []; d.equipment = d.equipment || []; d.loans = d.loans || [];
  d.consumables = d.consumables || []; d.stockLogs = d.stockLogs || []; d.wasteLogs = d.wasteLogs || [];
  d.settings = d.settings || {};
  d.settings.budgets = d.settings.budgets || {};

    ['Epson L15160', '잉크', 'Epson 008 시안 잉크', 28000, 3, 1.0],

    const annLY = rate * units, annTY = rate * units * factor;
    const c = { id: 'C' + pad(ci + 1).padStart(3, '0'), printerModel: pm, kind, name, price, initialStock: Math.round(annLY * 0.2), registeredDate: `${LY}-01-01` };
    consumables.push(c);
    const ev = [];
    [[`${LY}-01-06`, .6], [`${LY}-04-06`, .4], [`${LY}-07-06`, .1], [`${LY}-10-06`, .05], [`${Y}-01-06`, .5], [`${Y}-04-06`, .35], [`${Y}-07-06`, .1]]

        const lastDay = (yy === Y && mo === pd(t).getMonth() + 1) ? Math.max(1, pd(t).getDate() - 1) : dim;

        let q = Math.floor(ann / 12 * frac * (0.8 + 0.4 * rnd()) + rnd());

  const missing = [];
  stockLogs.forEach(l => {
    if (l.kind !== '불출' || !tonerIds.has(l.consumableId)) return;
    l.returnQty = l.qty;

    if (rnd() < 0.6) { const d = addDays(l.date, ri(3, 20)); if (d < t) wasteLogs.push({ id: 'W' + String(++wg).padStart(4, '0'), consumableId: l.consumableId, kind: '추가회수', date: d, qty: 1, dept: l.dept, vendor: '', handler: pick(['정', '부']), note: `${l.date} 불출분 미반납 회수` }); }

    let got = 0;
    stockLogs.forEach(l => { if (l.consumableId === c.id && l.kind === '불출' && l.date <= d) got += l.returnQty; });
    wasteLogs.forEach(w => { if (w.consumableId === c.id && w.kind === '추가회수' && w.date <= d) got += w.qty; });

  return normalize({ version: APP_VERSION, models, equipment, loans, consumables, stockLogs, wasteLogs, settings: { budgets, reportExports, purchasePlans: {}, fileInfo: null, depts: DEPTS.slice(), deptParents: Object.assign({}, SAMPLE_PARENTS), dataKind: 'sample' } });

let _mOk = null;
function openModal(title, body, onOk, okLabel = '저장', extra = [], opts = {}) {
  document.querySelector('#modalBg .modal').classList.toggle('wide', !!opts.wide);
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mBody').innerHTML = body;
  document.getElementById('mErr').textContent = '';
  const foot = document.getElementById('mFoot');
  foot.innerHTML = '';
  extra.forEach(b => { const el = document.createElement('button'); el.className = 'btn left ' + (b.cls || ''); el.textContent = b.label; el.onclick = b.fn; foot.appendChild(el); });
  const c = document.createElement('button'); c.className = 'btn'; c.textContent = opts.cancelLabel || '취소'; c.onclick = closeModal; foot.appendChild(c);
  if (onOk) { const o = document.createElement('button'); o.className = 'btn primary'; o.textContent = okLabel; o.onclick = () => { const r = onOk(); if (r !== false) closeModal(); }; foot.appendChild(o); }
  _mOk = onOk;
  document.getElementById('modalBg').classList.remove('hidden');
  const first = document.querySelector('#mBody input:not([type=hidden]), #mBody select');
  if (first) first.focus();
}
function closeModal() { document.getElementById('modalBg').classList.add('hidden'); _mOk = null; }
function mErr(msg) { document.getElementById('mErr').textContent = msg; return false; }
document.addEventListener('keydown', e => {
  if (document.getElementById('modalBg').classList.contains('hidden')) return;

});
const gv = id => document.getElementById(id).value.trim();

}

   글상자를 새로 만들면 한글 조합(IME)이 끊겨 "민원과"가 "ㅁㅣㄴㅇㅜㅓㄴ…"처럼 낱자로 들어가기 때문.
   새 화면에서 같은 id의 글상자까지 이어지는 조상 요소만 남기고, 나머지 형제 요소를 새것으로 바꾼다. */
function patchKeeping(root, html, keep) {
  const tmp = document.createElement(root.tagName); tmp.innerHTML = html;

    const dx = ev.clientX - startX; if (Math.abs(dx) > 2) moved = true;
    w = Math.max(40, Math.round(startW + dx));
    th.style.width = w + 'px'; tb.style.width = (others + w) + 'px';
  };
  const up = () => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    document.body.classList.remove('col-resizing');
    _noSortUntil = Date.now() + 300;
    if (!moved) return;
    COLW[key] = COLW[key] || {}; COLW[key][th.dataset.col] = w; saveColW();
  };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
}
function resetColWidths() {
  if (!confirm('이 PC에서 조절한 모든 표의 열 너비를 원래대로 되돌릴까요?')) return;

function toggleSort(key, col) {
  const s = S.tsort[key];
  if (!s || s.col !== col) S.tsort[key] = { col, dir: 1 };
  else if (s.dir === 1) s.dir = -1;
  else delete S.tsort[key];

  render();
}

function loanModal(assetNo) {

    `<div class="hint">※ 개인정보 보호를 위해 이름은 입력하지 않습니다.</div>` +

    fRow('대여일', fIn('lDate', t, 'date'), true) +
    fRow('반납예정일', fIn('lDue', addDays(t, 30), 'date'), true) +

    () => {
      const v = { assetNo: gv('lAsset'), dept: gv('lDept'), position: gv('lPos'), docNo: gv('lDoc'), loanDate: gv('lDate'), dueDate: gv('lDue'), loanChecker: gv('lChk') };
      const err = loanValidate(v); if (err) return mErr(err);
      const e = DB.equipment.find(x => x.assetNo === v.assetNo);
      if (!e || e.status !== '대여 가능') return mErr('선택한 장비는 대여 가능 상태가 아닙니다.');

function loanValidate(v) {
  const miss = [];
  if (!v.dept) miss.push('대여 부서'); if (!v.position) miss.push('대여자 직책'); if (!v.docNo) miss.push('공문번호');
  if (!v.loanDate) miss.push('대여일'); if (!v.dueDate) miss.push('반납예정일');
  if (miss.length) return `필수 항목을 입력하세요: ${miss.join(', ')}`;
  if (v.dueDate < v.loanDate) return '반납예정일은 대여일 이후여야 합니다.';
  return '';
}

function serialOwner(sn, exceptAsset) { sn = (sn || '').trim().toUpperCase(); return sn ? DB.equipment.find(x => x.assetNo !== exceptAsset && (x.serial || '').trim().toUpperCase() === sn) : null; }
function addEquipModal(modelId) {

    () => {

      if (!(n >= 1 && n <= 500)) return mErr('추가 대수는 1~500 사이로 입력하세요.');
      const manual = gv('aAsset');
      if (manual && n !== 1) return mErr('자산번호를 직접 입력할 때는 1대만 추가할 수 있습니다.');
      if (manual && DB.equipment.some(e => e.assetNo === manual)) return mErr('이미 있는 자산번호입니다.');

      }
      changed(`${n}대를 추가했습니다.`);
    }, '추가');
}

function rpDefault() { const t = TODAY(); return { y: +t.slice(0, 4), q: qOf(t), status: '', type: '', incDisposed: false, view: 'summary' }; }
function reportData() {
  const R = S.rp, base = qEnd(R.y, R.q);
  const all = DB.equipment.filter(e => MM[e.modelId].introDate <= base && (R.incDisposed || e.status !== '불용처리'))
    .map(e => { const m = MM[e.modelId]; return { e, m, ex: expiry(m), st: lifeStatus(m, base) }; });
  const counts = { 정상: 0, '사전 검토 대상': 0, '구매 소요 확정 대상': 0, '불용 대상': 0 }; all.forEach(r => counts[r.st]++);
  const rows = all.filter(r => (!R.type || r.m.type === R.type) && (!R.status || r.st === R.status)).sort((a, b) => sortEquip(a.e, b.e));
  // 총괄: 모델 단위
  const groups = [];
  TYPES.forEach(tp => {
    const byM = {}; const order = [];
    rows.filter(r => r.m.type === tp).forEach(r => { if (!byM[r.m.id]) { byM[r.m.id] = { m: r.m, ex: r.ex, st: r.st, n: 0 }; order.push(r.m.id); } byM[r.m.id].n++; });
    if (order.length) groups.push({ type: tp, items: order.map(id => byM[id]), n: order.reduce((s, id) => s + byM[id].n, 0) });
  });
  return { base, rows, groups, counts, total: rows.length };
}

      <span>정상 <b>${fmtN(D.counts['정상'])}</b>대</span><span class="txt-orange">구매 소요 확정 대상 ${fmtN(D.counts['구매 소요 확정 대상'])}대</span><span class="txt-red">불용 대상 ${fmtN(D.counts['불용 대상'])}대</span><span style="color:#a16207;font-weight:700">사전 검토 대상 ${fmtN(D.counts['사전 검토 대상'])}대</span>
      <span class="muted">${exp ? `이 분기 마지막 내보내기: ${fmtDT(exp)}` : '이 분기는 아직 내보내지 않음'}</span></div>
    <div class="subtabs"><button class="${R.view === 'summary' ? 'on' : ''}" onclick="S.rp.view='summary';render()">총괄현황 (모델 단위)</button><button class="${R.view === 'detail' ? 'on' : ''}" onclick="S.rp.view='detail';render()">세부현황 (${fmtN(D.total)}대)</button></div>

function sortedLogs() { return DB.stockLogs.slice().sort((a, b) => cmp(a.date, b.date)); }
function stockMap(upto) {
  const s = {}; DB.consumables.forEach(c => s[c.id] = Number(c.initialStock) || 0);
  sortedLogs().forEach(l => {
    if (upto && l.date > upto) return; if (!(l.consumableId in s)) return;
    if (l.kind === '입고') s[l.consumableId] += l.qty; else if (l.kind === '불출') s[l.consumableId] -= l.qty; else if (l.kind === '실사보정') s[l.consumableId] = l.qty;
  });
  return s;
}
function sumOut(cid, from, to) { let n = 0; DB.stockLogs.forEach(l => { if (l.consumableId === cid && l.kind === '불출' && l.date >= from && l.date <= to) n += l.qty; }); return n; }
function printerNames() { return [...new Set(DB.models.filter(m => m.type === '프린터').map(m => m.name))].sort(); }
function printerUnits(name, y) {
  // 운영 대수: 올해 안에 불용 대상이 되는 장비 제외 (불용처리 완료 장비도 제외)
  const yEnd = `${y}-12-31`, yStart = `${y}-01-01`;
  const eq = DB.equipment.filter(e => { const m = MM[e.modelId]; return m.type === '프린터' && m.name === name && m.introDate <= yEnd; });
  const live = eq.filter(e => e.status !== '불용처리');
  const op = live.filter(e => expiry(MM[e.modelId]) > yEnd).length;
  const lyEnd = `${y - 1}-12-31`, lyStart = `${y - 1}-01-01`;
  const ly = DB.equipment.filter(e => { const m = MM[e.modelId]; return m.type === '프린터' && m.name === name && m.introDate <= lyEnd && expiry(m) >= lyStart; }).length;
  return { op, excluded: live.length - op, ly };
}
function csLabel(c) { return `${c.printerModel} · ${c.kind} · ${c.name}`; }
function sortCs(a, b) { return cmp(a.printerModel, b.printerModel) || CS_KINDS.indexOf(a.kind) - CS_KINDS.indexOf(b.kind) || cmp(a.name, b.name); }

function renderCons() {
  const tabs = [['stock', '소모품 재고'], ['logs', '입출고 기록'], ['monthly', '월별 불출 현황'], ['waste', '폐토너 관리'], ['cmp', '소모량 비교'], ['plan', '분기 구매 소요표']];
  const sub = `<div class="subtabs">${tabs.map(([k, l]) => `<button class="${S.csTab === k ? 'on' : ''}" onclick="S.csTab='${k}';render()">${l}</button>`).join('')}</div>`;
  const body = { stock: renderStock, logs: renderLogs, monthly: renderMonthly, waste: renderWaste, cmp: renderCmp, plan: renderPlan }[S.csTab]();
  return `<h2>소모품 (운영용품)</h2>${sub}${body}`;
}
function renderStock() {
  const st = stockMap(), t = TODAY(), Y = +t.slice(0, 4);
  const list = DB.consumables.slice().sort(sortCs);
  const rows = list.map(c => {
    const s = st[c.id], ty = sumOut(c.id, `${Y}-01-01`, t), me = monthsElapsed(t), avg = me > 0 ? ty / me : 0;
    const months = avg > 0 ? s / avg : Infinity;
    const warn = s <= 0 ? '<span class="badge b-red">재고 없음</span>' : months < 12 - me ? `<span class="badge b-orange">연말 전 소진 예상 (${fmt1(months)}개월)</span>` : '';
    return `<tr id="cs-${h(c.id)}"><td>${h(c.printerModel)}</td><td>${h(c.kind)}</td><td>${h(c.name)}</td><td class="n">${fmtN(c.price)}</td><td class="n"><b>${fmtN(s)}</b></td><td class="n">${fmt1(avg)}</td><td>${warn}</td>
    <td><button class="btn sm" onclick="logModal('입고',${ja(c.id)})">입고</button> <button class="btn sm primary" onclick="logModal('불출',${ja(c.id)})">불출</button> <button class="btn sm" onclick="logModal('실사보정',${ja(c.id)})">실사</button> <button class="btn sm" onclick="csModal(${ja(c.id)})">수정</button></td></tr>`;
  }).join('');
  return `<div class="panel"><div class="filters"><span class="muted">현재 재고 = 최초 재고 + 입고 − 불출 (실사보정 시 그 수량으로 맞춤). 자동 계산됩니다.</span><div class="spacer"></div>
    <button class="btn" onclick="logModal('입고')">+ 입고 기록</button><button class="btn primary" onclick="logModal('불출')">+ 불출 기록</button><button class="btn" onclick="logModal('실사보정')">실사 보정</button><button class="btn" onclick="csModal()">+ 소모품 등록</button><button class="btn" onclick="exportStock()">📥 현재고 엑셀</button></div>
  <div class="tablewrap"><table class="t"><thead><tr><th>대응 프린터 모델</th><th>종류</th><th>품명</th><th class="n">단가(원)</th><th class="n">현재 재고</th><th class="n">올해 월평균 불출</th><th>상태</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="8" class="empty">등록된 소모품이 없습니다.</td></tr>'}</tbody></table></div></div>`;
}

function monthlyData() {
  const t = TODAY(), M = S.mf;
  const Y = String(M.year || t.slice(0, 4));
  const csMap = {}; DB.consumables.forEach(c => csMap[c.id] = c);
  const groups = {};
  DB.stockLogs.forEach(l => {
    if (l.kind !== '불출' || !l.date.startsWith(Y)) return;
    const c = csMap[l.consumableId]; if (!c) return;
    if (M.kind && c.kind !== M.kind) return;
    const key = M.by === 'dept' ? (l.dept || '(부서 없음)') : M.by === 'printer' ? c.printerModel : c.id;
    if (!groups[key]) groups[key] = { key, c: M.by === 'item' ? c : null, m: Array(12).fill(0) };
    const v = M.unit === 'amount' ? l.qty * (Number(c.price) || 0) : l.qty;
    groups[key].m[+l.date.slice(5, 7) - 1] += v;
  });
  if (M.by === 'item') DB.consumables.forEach(c => { if ((!M.kind || c.kind === M.kind) && !groups[c.id]) groups[c.id] = { key: c.id, c, m: Array(12).fill(0) }; });
  const rows = Object.values(groups).map(g => Object.assign(g, { total: g.m.reduce((a, b) => a + b, 0) }));
  if (M.by === 'item') rows.sort((a, b) => sortCs(a.c, b.c)); else rows.sort((a, b) => b.total - a.total || a.key.localeCompare(b.key, 'ko'));
  const colTot = Array(12).fill(0); rows.forEach(r => r.m.forEach((v, i) => colTot[i] += v));
  const lastMonth = Y === t.slice(0, 4) ? +t.slice(5, 7) : 12; // 올해는 이번 달까지
  return { Y, rows, colTot, total: colTot.reduce((a, b) => a + b, 0), lastMonth };
}

    const u = printerUnits(pn, y);
    DB.consumables.filter(c => c.printerModel === pn).sort(sortCs).forEach(c => {

        const per = u.ly ? lyOut / u.ly : 0;

function guideSheet(g) {
  const W = [16, 8, 40, 24, 46], total = W.reduce((a, b) => a + b, 0);
  const tw = s => [...String(s)].reduce((n, ch) => n + (ch.charCodeAt(0) > 0x2e80 ? 1.75 : 1), 0);

  const sh = { name: '작성 안내', cols: W, rows: [], merges: [], heights: {} };
  const push = (row, ht) => { if (ht) sh.heights[sh.rows.length] = ht; sh.rows.push(row); return sh.rows.length; };
  const para = (text, s = X.para) => { const r = push([{ v: text, s }], lines(text, total) * 16 + 4); sh.merges.push(`A${r}:E${r}`); };
  const section = text => { push([]); const r = push([{ v: text, s: X.section }, ...Array(4).fill({ v: '', s: X.section })], 22); sh.merges.push(`A${r}:E${r}`); };
  let r = push([{ v: g.title, s: X.title }], 30); sh.merges.push(`A${r}:E${r}`);
  para(g.intro);
  section('■ 작성 순서');
  g.steps.forEach((s, i) => para(`${i + 1}. ${s}`));
  section('■ 칸별 작성 방법   (★ = 꼭 적어야 하는 칸)');
  push(['칸 이름', '필수', '무엇을 적나요', '예시', '알아두세요'].map(v => ({ v, s: X.header })), 20);
  g.fields.forEach(([name, req, what, ex, note]) => {
    const ht = Math.max(lines(name, W[0]), lines(what, W[2]), lines(ex, W[3]), lines(note, W[4])) * 15 + 6;
    push([{ v: name, s: X.label }, { v: req ? '★ 필수' : '선택', s: req ? X.red : X.center }, { v: what, s: X.wrap }, { v: ex, s: X.wrap }, { v: note, s: X.wrap }], ht);
  });
  section('■ 이렇게 하면 안 돼요 (자주 하는 실수)');
  g.mistakes.forEach(s => para('• ' + s));
  if (g.after) { section('■ 올린 뒤에는'); g.after.forEach(s => para('• ' + s)); }
  return sh;
}

function importModelRows(f, data, rows) {
  const errs = [], groups = {};

  rows.forEach(({ rowNo, raw }) => {

    if (e.length) { errs.push({ rowNo, label: `${v.type} ${v.name}`.trim(), msg: e.join(', ') }); return; }
